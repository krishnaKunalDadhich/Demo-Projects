<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FocusOS — Smart Student Productivity OS">
  <title>FocusOS — Student Productivity OS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lucide-static@0.468.0/font/lucide.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">F</div><div><strong>FocusOS</strong><span>Student productivity</span></div></div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><i class="icon icon-layout-dashboard"></i>Dashboard</button>
        <button class="nav-item" data-view="tasks"><i class="icon icon-check-square"></i>Tasks</button>
        <button class="nav-item" data-view="subjects"><i class="icon icon-book-open"></i>Subjects</button>
        <button class="nav-item" data-view="planner"><i class="icon icon-calendar-days"></i>Planner</button>
        <button class="nav-item" data-view="focus"><i class="icon icon-timer"></i>Focus Mode</button>
        <button class="nav-item" data-view="analytics"><i class="icon icon-chart-no-axes-combined"></i>Analytics</button>
        <button class="nav-item" data-view="calendar"><i class="icon icon-calendar"></i>Calendar</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><i class="icon icon-settings"></i>Settings</button>
        <div class="mini-tip"><i class="icon icon-lightbulb"></i><span>Small steps compound. Finish one important thing today.</span></div>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="Open navigation"><i class="icon icon-menu"></i></button>
        <div class="topbar-title"><span id="pageEyebrow">Overview</span><h1 id="pageTitle">Dashboard</h1></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"><i class="icon icon-moon"></i></button>
          <button class="icon-btn" id="notifyBtn" title="Enable notifications" aria-label="Enable notifications"><i class="icon icon-bell"></i></button>
          <div class="avatar" title="Student profile">K</div>
        </div>
      </header>
      <div id="toastRegion" class="toast-region" aria-live="polite"></div>
      <section id="appView" class="view-container" aria-live="polite"></section>
    </main>
  </div>

  <div class="modal-backdrop hidden" id="modalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">Form</span><h2 id="modalTitle">Add item</h2></div><button class="icon-btn" id="modalClose" aria-label="Close"><i class="icon icon-x"></i></button></div>
      <form id="modalForm" class="form-grid"></form>
    </div>
  </div>

  <div id="srStatus" class="sr-only" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
